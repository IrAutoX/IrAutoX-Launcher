name: Windows Build and Release

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare launcher assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party/vazirmatn | Out-Null
          if (-not (Test-Path resources/Vazir.ttf)) {
            Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf" -OutFile resources/Vazir.ttf
          }
          if (-not (Test-Path third_party/vazirmatn/OFL.txt)) {
            Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/OFL.txt" -OutFile third_party/vazirmatn/OFL.txt
          }
          if (-not (Test-Path third_party/vazirmatn/AUTHORS.txt)) {
            Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/AUTHORS.txt" -OutFile third_party/vazirmatn/AUTHORS.txt
          }
          python -m pip install --disable-pip-version-check --quiet pillow cairosvg
          python tools/make_windows_icon.py
          python tools/apply_launcher_preview_fixes.py

      - name: Commit generated preview assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/steam-ui-updater-launch-routing'
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/app.ico resources/Vazir.ttf third_party/vazirmatn/OFL.txt third_party/vazirmatn/AUTHORS.txt resources/resources.qrc
            git commit -m "Generate Windows icon and preview assets [skip ci]"
            git push origin HEAD:agent/steam-ui-updater-launch-routing
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIRAUTOX_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXLauncher.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXUpdater.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/irxcmd.exe

      - name: Compress executables with UPX
        shell: pwsh
        run: |
          choco install upx --no-progress -y
          upx --best --lzma dist/IrAutoXLauncher.exe
          upx --best --lzma dist/IrAutoXUpdater.exe
          upx --best --lzma dist/irxcmd.exe

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = "2.0.0"
          $isRelease = $false
          $isPreview = $false
          $releaseTag = ""
          $targetSha = (git rev-parse HEAD).Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $isRelease = $true
            $releaseTag = "${{ github.ref_name }}"
          } elseif ($env:GITHUB_REF -eq "refs/heads/main") {
            $releaseMatch = [regex]::Match([string]$env:COMMIT_MESSAGE, '^Release v([0-9]+\.[0-9]+\.[0-9]+)')
            if ($releaseMatch.Success) {
              $version = $releaseMatch.Groups[1].Value
              $isRelease = $true
              $releaseTag = "v$version"
            }
          } elseif ($env:GITHUB_REF -eq "refs/heads/agent/steam-ui-updater-launch-routing") {
            $isRelease = $true
            $isPreview = $true
            $releaseTag = "preview-steam-ui-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "is_preview=$($isPreview.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "target_sha=$targetSha" >> $env:GITHUB_OUTPUT

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release/IrAutoX-Launcher-v${{ steps.version.outputs.version }}-Portable.zip" -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\dist" "/DOutputDir=$pwd\release" "/DVersion=${{ steps.version.outputs.version }}" packaging/IrAutoXLauncher.iss

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-Launcher-Portable
          path: release/*-Portable.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-Launcher-Setup
          path: release/*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: ${{ steps.version.outputs.target_sha }}
          name: ${{ steps.version.outputs.is_preview == 'true' && 'IrAutoX Launcher Preview' || format('IrAutoX Launcher v{0}', steps.version.outputs.version) }}
          prerelease: ${{ steps.version.outputs.is_preview == 'true' }}
          generate_release_notes: true
          files: |
            release/*-Portable.zip
            release/*-Setup.exe
