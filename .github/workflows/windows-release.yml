name: Windows Build and Release

on:
  push:
    branches: [main, "agent/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = "2.0.0"
          $isRelease = $false
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $isRelease = $true
          } elseif ($env:GITHUB_REF -eq "refs/heads/main") {
            $releaseMatch = [regex]::Match([string]$env:COMMIT_MESSAGE, '^Release v([0-9]+\.[0-9]+\.[0-9]+)')
            if ($releaseMatch.Success) {
              $version = $releaseMatch.Groups[1].Value
              $isRelease = $true
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Embed Vazirmatn font
        shell: pwsh
        run: ./scripts/embed-vazirmatn.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIRAUTOX_BUILD_TESTS=ON "-DIRAUTOX_VERSION_OVERRIDE=${{ steps.version.outputs.version }}"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXLauncher.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXUpdater.exe
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item LICENSE dist/LICENSE.txt

      - name: Compress executables with UPX
        shell: pwsh
        run: |
          choco install upx --no-progress -y
          upx --best --lzma dist/IrAutoXLauncher.exe dist/IrAutoXUpdater.exe

      - name: Create portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release/IrAutoX-Launcher-v${{ steps.version.outputs.version }}-Portable.zip" -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\dist" "/DOutputDir=$pwd\release" "/DVersion=${{ steps.version.outputs.version }}" packaging/IrAutoXLauncher.iss

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-Launcher-Portable
          path: release/*-Portable.zip
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-Launcher-Setup
          path: release/*-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: IrAutoX Launcher v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*-Portable.zip
            release/*-Setup.exe
