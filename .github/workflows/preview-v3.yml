name: IrAutoX 2.0.3 Reliability Build

on:
  push:
    branches: ["agent/steam-ui-updater-launch-routing"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-v203:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize launcher 2.0.3 sources
        shell: pwsh
        run: |
          magick resources/logo.svg -background none -define icon:auto-resize=256,128,64,48,32,24,16 resources/app.ico
          python tools/apply_launcher_preview_fixes.py
          python tools/finalize_preview_v3.py
          python tools/apply_v202.py
          python tools/apply_v202_post.py
          python tools/apply_v203_reliability.py
          python tools/fix_v203_updater.py

      - name: Commit generated reliability sources
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/app.ico resources/resources.qrc resources/theme.qss src/ui/MainWindow.cpp src/ui/MainWindow.h src/updater/main_v203.cpp
            git commit -m "Finalize IrAutoX 2.0.3 reliability integration [skip ci]"
            git push origin HEAD:agent/steam-ui-updater-launch-routing
          }

      - name: Resolve target commit
        id: meta
        shell: pwsh
        run: |
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: Validate reliability integration
        shell: pwsh
        run: |
          python -m py_compile tools/apply_v203_reliability.py tools/fix_v203_updater.py
          if (-not (Select-String -Path src/ui/MainWindow.cpp -Pattern "m_requestedDetailAssets.clear" -Quiet)) { throw "startup asset refresh missing" }
          if (-not (Select-String -Path src/ui/MainWindow.cpp -Pattern "refreshThisSession" -Quiet)) { throw "per-session asset cache refresh missing" }
          if (-not (Select-String -Path src/ui/MainWindow.cpp -Pattern "getExistingDirectory" -Quiet)) { throw "per-game install folder picker missing" }
          if (-not (Select-String -Path src/core/DownloadManager.cpp -Pattern "Accept-Ranges" -Quiet)) { throw "range probe missing" }
          if (-not (Select-String -Path src/core/DownloadManager.cpp -Pattern "HTTP %1" -Quiet)) { throw "HTTP retry diagnostics missing" }
          if (-not (Select-String -Path src/main.cpp -Pattern "--parent-pid" -Quiet)) { throw "updater parent binding missing" }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIRAUTOX_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test launcher and SDK
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate website
        shell: pwsh
        run: |
          node --check website/app.js
          python -m py_compile website/server.py
          python -m json.tool website/games.json | Out-Null

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXLauncher.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXUpdater.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/irxcmd.exe

      - name: Compress executables
        shell: pwsh
        run: |
          choco install upx --no-progress -y
          upx --best --lzma dist/IrAutoXLauncher.exe
          upx --best --lzma dist/IrAutoXUpdater.exe
          upx --best --lzma dist/irxcmd.exe

      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release/IrAutoX-Launcher-v2.0.3-Portable.zip" -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\dist" "/DOutputDir=$pwd\release" "/DVersion=2.0.3" packaging/IrAutoXLauncher.iss

      - name: Generate SHA256 list
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-v203-${{ github.run_number }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: IrAutoX Launcher 2.0.3 Reliability Preview
          prerelease: true
          generate_release_notes: true
          files: |
            release/IrAutoX-Launcher-v2.0.3-Portable.zip
            release/IrAutoX-Launcher-v2.0.3-Setup.exe
            release/SHA256SUMS.txt
