name: Preview Updater V4 Build

on:
  push:
    branches: ["agent/steam-ui-updater-launch-routing"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-v4:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate icon and finalize launcher sources
        shell: pwsh
        run: |
          magick resources/logo.svg -background none -define icon:auto-resize=256,128,64,48,32,24,16 resources/app.ico
          python tools/apply_launcher_preview_fixes.py
          python tools/finalize_preview_v3.py

      - name: Commit generated launcher sources
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add resources/app.ico resources/resources.qrc resources/theme.qss src/ui/MainWindow.cpp src/ui/MainWindow.h
            git commit -m "Finalize persistent game icon cache [skip ci]"
            git push origin HEAD:agent/steam-ui-updater-launch-routing
          }

      - name: Resolve target commit
        id: meta
        shell: pwsh
        run: |
          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DIRAUTOX_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXLauncher.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/IrAutoXUpdater.exe
          windeployqt --release --compiler-runtime --no-translations --no-opengl-sw dist/irxcmd.exe

      - name: Compress executables
        shell: pwsh
        run: |
          choco install upx --no-progress -y
          upx --best --lzma dist/IrAutoXLauncher.exe
          upx --best --lzma dist/IrAutoXUpdater.exe
          upx --best --lzma dist/irxcmd.exe

      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release/IrAutoX-Launcher-v2.0.1-Portable.zip" -CompressionLevel Optimal

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSourceDir=$pwd\dist" "/DOutputDir=$pwd\release" "/DVersion=2.0.1" packaging/IrAutoXLauncher.iss

      - name: Publish preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-updater-v4-${{ github.run_number }}
          target_commitish: ${{ steps.meta.outputs.sha }}
          name: IrAutoX Launcher 2.0.1 Updater Preview
          prerelease: true
          generate_release_notes: true
          files: |
            release/*-Portable.zip
            release/*-Setup.exe
